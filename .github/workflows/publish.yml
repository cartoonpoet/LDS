name: Publish @lawkit/ui (manual)

# 수동 배포용 백업 — main-publish.yml이 자동 배포를 처리하므로
# 이 워크플로우는 수동으로만 실행 (Actions 탭 → Run workflow)
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @lawkit/ui test

      - name: Build
        run: pnpm --filter @lawkit/ui build

      - name: Publish
        run: pnpm --filter @lawkit/ui publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
