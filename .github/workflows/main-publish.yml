name: Test & Publish (main)

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @lawkit/ui test

      - name: Determine bump type
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$COMMIT_MSG" | grep -qi '\[major\]'; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qi '\[minor\]'; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: version
        run: |
          CURRENT=$(node -p "require('./packages/ui-v3/package.json').version")
          NEW=$(node -e "
            const [major, minor, patch] = '$CURRENT'.split('.').map(Number);
            const type = '${{ steps.bump.outputs.type }}';
            if (type === 'major') process.stdout.write((major+1)+'.0.0');
            else if (type === 'minor') process.stdout.write(major+'.'+(minor+1)+'.0');
            else process.stdout.write(major+'.'+minor+'.'+(patch+1));
          ")
          jq --arg v "$NEW" '.version = $v' packages/ui-v3/package.json > /tmp/pkg.json && mv /tmp/pkg.json packages/ui-v3/package.json
          echo "new_version=v$NEW" >> $GITHUB_OUTPUT

      - name: Collect changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -1)
          if [ -n "$PREV_TAG" ]; then
            LOGS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"• %s" --no-merges | grep -v '\[skip ci\]' | head -10)
          else
            LOGS=$(git log --pretty=format:"• %s" --no-merges -5)
          fi
          echo "logs<<EOF" >> $GITHUB_OUTPUT
          echo "$LOGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ui-v3/package.json
          git commit -m "chore: release ${{ steps.version.outputs.new_version }} [skip ci]"
          git tag ${{ steps.version.outputs.new_version }}
          git push origin main --follow-tags

      - name: Build
        run: pnpm --filter @lawkit/ui build

      - name: Publish to npm
        run: pnpm --filter @lawkit/ui publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify success
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
          CHANGELOG: ${{ steps.changelog.outputs.logs }}
        run: |
          TEXT=$(printf "✅ @lawkit/ui %s npm 배포 완료\n\n%s" "$VERSION" "$CHANGELOG")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$TEXT"
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$TEXT" '{text: $t}')"
          fi

      - name: Notify failure
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TEXT="❌ @lawkit/ui 배포 실패 — $COMMIT_MSG"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$TEXT"
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$TEXT" '{text: $t}')"
          fi
